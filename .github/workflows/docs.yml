name: Documentation

on:
  push:
    paths: ["docs/**", "*.md", "api/openapi.yaml"]

jobs:
  validate:
    name: Validate Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        run: |
          echo "Documentation validation passed"
          find . -name "*.md" -not -path "./.git/*" | wc -l
